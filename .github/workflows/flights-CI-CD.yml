name: flights-CI/CD

on:
  push:
    branches:
      - main
    paths:
      # Watch your specific Django app folders
      - 'flightApp/**'
      - 'flights/**'
      # Watch core Python files at the root
      - 'manage.py'
      - 'requirements*.txt'
      - '.github/workflows/flights-CI-CD.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'flightApp/**'
      - 'flights/**'
      - 'manage.py'
      - 'requirements*.txt'
      - '.github/workflows/flights-CI-CD.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ${{ secrets.django_secret_key }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
            python-version: "3.12"
                    
      - name: Install python dependencies
        run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
        
      - name: Run migrations
        run: python manage.py migrate
            
      - name: Run tests
        run: python manage.py test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build docker image
        run: docker build -t aranya3/flights-app:latest .

      - name: Push docker image
        run: docker push aranya3/flights-app:latest
# Load standard file extensions (so Nginx knows how to properly serve CSS, JS, etc.)
include mime.types;

# --- THE LOAD BALANCER ---
# Define a 'cluster' of backend Django servers to distribute traffic across.
upstream django_cluster {
    # Algorithm: Route incoming requests to the worker with the fewest active connections
    least_conn; 
    
    # The internal Docker addresses of your Django apps.
    # Both use 8000 because Nginx communicates over the internal Docker network.
    server web-1:8000;
    server web-2:8000;
}

# --- THE WEB SERVER ---
server {
    # Nginx listens for outside traffic on port 8080
    listen 8080;
    server_name localhost;

    # Apply these rules to all incoming traffic (the root path '/')
    location / {
        # Forward the traffic to the 'django_cluster' defined above
        proxy_pass http://django_cluster;
        
        # --- ESSENTIAL HEADERS ---
        # Pass the original domain name requested by the user to Django
        proxy_set_header Host $host;
        
        # Forward the actual user's IP address to Django.
        # If you don't do this, Django will think every single user 
        # is just the Nginx container's internal IP address!
        proxy_set_header X-Real-IP $remote_addr;
    }
}